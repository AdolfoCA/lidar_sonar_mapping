# =============================================================================
# sonar_no_semantic.yaml
# Configuration for the lightweight (no-semantic) sonar mapping pipeline.
# Used by: sonar_mapping_no_semantic.launch.py
#
# Nodes configured here:
#   - sonar_scan_ned
#   - sonar_map_ned (sonar_map_ned_no_semantic executable)
#
# No object_cluster_node or sdf_fitting_node are launched.
# =============================================================================

sonar_scan_ned:
  ros__parameters:
    odom_frame:        "odom"
    sonar_frame:       "blueview_sonar"
    sonar_cloud_topic: "/blueview/point2/leading"
    output_topic:      "sonar_scan"
    tf_timeout:        10.0
    scan_publish_rate: 10.0
    latency_compensation_ms: 0.0  # increase if structures appear shifted in direction of travel

sonar_map_ned:
  ros__parameters:
    input_topic:    "sonar_scan"
    output_topic:   "sonar_map"
    map_frame:      "odom"
    max_points:     10000000
    publish_rate:   1.0
