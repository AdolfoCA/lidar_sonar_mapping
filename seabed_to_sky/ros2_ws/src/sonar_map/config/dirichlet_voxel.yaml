# =============================================================================
# dirichlet_voxel.yaml — config for the eq-24 FIXED-CLASS Dirichlet pipeline.
# Pipeline: sonar_scan_ned -> seabed_estimator -> return_classifier ->
#           voxel_mapper -> seabed_surface  (+ debug observers).
# Frame: odom (ENU, z up).
#
# The per-return class-conditional likelihood is the paper's eq-24
# factorization, evaluated in voxel_mapper over a PREDEFINED class inventory
# plus the trailing catch-all "other":
#     L_{i,c} = p(p_i|c) · p(I_i|p_i,c) · p(ℓ_i|c) · p(m_i|c)
#       position  (eq 31)   intensity (eq 34)   lidar (eq 37)   shape (eq 42)
# ALL class-conditional parameters (Table I: ν/ω, μ/σ, π/κ/γ, ρ + the shape
# Gaussians) live in classes.yaml — NOT here. This file only carries node
# wiring and the CLASS-INDEPENDENT knobs: alpha_0 (α), the spatial-prior
# radius eps (ε, eq 23), the overhead-column radius eps_xy (ε_xy, eq 35), the
# rolling bottom reference ẑ_bed (eq 25) and display parameters. Each tunable
# notes what INCREASING it does (↑).
# eps_L / eps_Lz are LEGACY (pre-eq-24 nearest-LiDAR support): eq 24 does not
# consume them, but the debug observers and the lidar_dist/lidar_count
# telemetry channels still do — keep them equal across the nodes that use
# them. eps_Lz (ε_Lz) is an engineering extension (not in the paper): an
# optional z half-height turning the eps_L XY support DISC into a cylinder;
# ≤0 keeps the pure-XY behaviour.
# =============================================================================

# -- Node 0 — sonar_scan_ned: raw sonar returns -> odom-frame `sonar_scan` ----
sonar_scan_ned:
  ros__parameters:
    odom_frame:               "odom"
    sonar_frame:              "blueview_sonar"
    sonar_cloud_topic:        "/blueview/leading_edge"
    output_topic:             "sonar_scan"
    tf_timeout:               0.5    # [s]  ↑ wait longer for TF before dropping a scan
    scan_publish_rate:        5.0    # [Hz] ↑ republish scans faster (more CPU)
    latency_compensation_ms:  0.0    # [ms] ↑ assume more sonar-to-pose latency

# -- Node 1 — seabed_estimator: scalar Kalman filter on seabed intensity μ_I --
seabed_estimator:
  ros__parameters:
    input_topic:        "sonar_scan"
    state_topic:        "seabed_estimator_state"
    mu_intensity_topic: "seabed_mu_intensity"

    intensity_outlier_sigma: 2.0    # [-] ↑ keep more outlier returns in the update
    min_returns:             10     # [-] ↑ need more returns before updating (skips sparse scans)
    i_prior_mean:            5000.0 # [I] initial seabed-intensity guess (μ_I prior)
    i_prior_std:             1000.0 # [I] ↑ less trust in the prior (faster initial adaptation)
    seabed_intensity_variation: 600.0 # [I] ↑ more process noise (tracks faster, noisier)
    i_meas_noise_floor:      50.0   # [I] ↑ trust each measurement less (slower, smoother)
    i_meas_noise_coupling:   1.0    # [-] ↑ inflate meas noise more on high-spread scans

# -- Node 2 — return_classifier: assemble the eq-9 measurement channels -------
# One ClassifiedReturns per scan carrying y_i = (p_i, I_i, ℓ_i, m_i): the
# bottom reference ẑ_bed for h_i = z_i − ẑ_bed (eq 25), the overhead LiDAR
# column (k_i, g_i — eqs 35–36) and the pass-through shape channels m_i
# extracted upstream in leading_edge_node (sonar3d_reconstruction). No hard
# label is assigned — classification is the soft eq-16 responsibility computed
# in voxel_mapper. The seabed_estimator state (μ_I/σ_I) is now OPTIONAL: it
# rides the output message as telemetry only, since the class intensity means
# μ_c of classes.yaml are ABSOLUTE values (eq 34), not offsets from μ_I.
return_classifier:
  ros__parameters:
    input_topic:   "sonar_scan"
    lidar_topic:   "/cloud_registered"  # registered surface-LiDAR cloud P_L (eq 35)
    state_topic:   "seabed_estimator_state"  # OPTIONAL — μ_I/σ_I telemetry only
    odom_topic:    "odometry"
    output_topic:  "classified_returns"

    # -- Overhead LiDAR column ℓ_i = (k_i, g_i)  (paper eqs 35–36) -------------
    eps_xy:  0.30   # [m]  ε_xy — horizontal radius of the vertical LiDAR column
                    #       K_i above the RETURN's own XY (eq 35): k_i = |K_i|,
                    #       g_i = min_{q∈K_i} z_q − z_i. ↑ wider column → more
                    #       overhead support counted (structure attribution
                    #       reaches farther sideways, gets coarser).

    # -- Rolling bottom reference ẑ_bed(x, y)  (feeds h_i, eq 25) --------------
    # Per-XY-cell EMA of a LOW z-quantile of each scan. Only the low quantile
    # enters, so returns from walls/objects (ABOVE the bed) bias the reference
    # little; the position factor widens ω_c for structure precisely because
    # this reference is approximate.
    bed_cell_size: 0.5   # [m]  XY cell of the bottom grid; ↑ coarser/smoother ẑ_bed
                         #       (fewer cells, less local bathymetry detail)
    bed_quantile:  0.25  # [-]  scan z-quantile blended into each cell; ↑ toward
                         #       the median → raised returns pull ẑ_bed upward more
    bed_forget:    0.10  # [-]  per-scan EMA blend α; ↑ adapt to new bathymetry
                         #       faster, but the reference gets noisier

    # -- LEGACY nearest-LiDAR support (NOT consumed by eq 24) ------------------
    # Kept for the debug observers and the lidar_dist/lidar_count telemetry
    # channels of ClassifiedReturns.
    eps_L:   0.1    # [m]  ε_L — LiDAR support-count radius around q*.
                    #       Counts LiDAR over a bigger XY disc as ↑ (more support).
                    #       XY/horizontal match for q* and d (z ignored there):
                    #       sonar is underwater, LiDAR on the surface — see the
                    #       return_classifier docstring.
    eps_Lz:  0.50   # [m]  ε_Lz — z half-height of the COUNT cylinder. >0 trims the
                    #       support set to LiDAR within ±ε_Lz of q*'s z (XY disc ∩
                    #       z band), so LiDAR at a very different height than q*
                    #       stops inflating the legacy count. ↑ taller band (more
                    #       z tolerant); ≤0 = DISABLED → pure XY disc. Does NOT
                    #       affect q*/d. MUST match the two debug nodes' eps_Lz.

# -- Node 3 — voxel_mapper: per-voxel Dirichlet update over the FIXED classes -
# Evaluates the four factors of eq 24 for every return, folds the eq-16
# responsibilities (under the eq-23 spatial prior when eps > 0) into each
# voxel's Dirichlet soft counts (eq 20), and publishes the posterior means
# (eq 21) as per-class theta_<name> point fields.
# ALL CLASS TUNING LIVES IN classes.yaml (see classes_file below) — adding,
# removing or retuning a class is a classes.yaml edit + restart; nothing
# class-specific is configured here.
voxel_mapper:
  ros__parameters:
    input_topic:     "classified_returns"
    voxel_topic:     "dirichlet_voxels"
    voxel_map_topic: "dirichlet_voxel_map"
    telemetry_topic: "eq24_telemetry"   # per-scan Eq24Telemetry: which factor
                                        # drives which class (Foxglove/PlotJuggler)
    map_frame:       "odom"

    classes_file: ""  # class-inventory YAML (Table I values + "other" block).
                      # '' = package default share/sonar_map/config/classes.yaml.
                      # Point it at a copy to A/B alternative inventories.
                      # REMEMBER: the launch reads the INSTALLED share dir —
                      # editing src/.../classes.yaml needs a colcon build.

    r_v:       0.05   # [m]  VOXEL SIZE — ↑ coarser map (fewer voxels, less CPU/RAM).
    alpha_0:   0.01   # [-]  α — symmetric Dirichlet prior (MUST match
                      #       seabed_surface.alpha_0); ↑ more uniform priors.

    # -- Spatial prior (paper eq 23) ------------------------------------------
    eps:       0.0    # [m]  ε — neighbourhood radius for the evidence-weighted
                      #       neighbour-posterior prior. 0 = DISABLED → uniform
                      #       symmetric-α_0 prior (r = L/ΣL), vectorised fast path
                      #       (no ε-ball query, no snapshot). Set >0 (≳ a few × r_v)
                      #       to enable the paper's eq-23 spatial coupling.

    # -- Elevation band (engineering detail; work-stream B replaces with a beam
    #    kernel). Δz = k_elev·slant_range, mass spread uniformly over the band.
    #    The elevation AMBIGUITY itself already enters eq 24 through ϱ_i (eq 30). --
    k_elev:    0.0    # [-]  ↑ spread each return over more z-voxels; 0 = single voxel

    # -- Display / publishing (no effect on the posterior or the MAP label) ---
    active_publish_rate: 2.0 # [Hz] ↑ republish voxel cloud faster (more CPU)
    snapshot_rate:   1.0    # [Hz]  ↑ snapshot to seabed_surface faster
    w_ref:           5.0    # [-]   displayed confidence = max_c θ̂_c · tanh(W/w_ref); ↑ need more W for full confidence
    w_display_min:   1.0    # [-]   ↑ raise display-only floor on W

# -- Node 4 — seabed_surface: promotion sweep + feedback to voxel_mapper ------
seabed_surface:
  ros__parameters:
    voxel_map_topic:     "dirichlet_voxel_map"
    promoted_keys_topic: "promoted_voxel_keys"
    map_frame:           "odom"

    seabed_class_name: "seabed"  # classes.yaml class promoted to the surface,
                                 # matched by NAME against the snapshot's
                                 # class_names (robust to inventory edits); a
                                 # missing name logs an error and disables
                                 # promotion instead of promoting column 0.
    alpha_0: 0.01     # [-]  α — MUST match voxel_mapper.alpha_0
    pi_conf: 0.7      # [-]  ↑ stricter posterior confidence to promote (fewer promotions)
    w_conf:  25.0     # [-]  ↑ more accumulated evidence required to promote
    sweep_rate: 0.2   # [Hz] ↑ sweep/promote more often

# -- Debug — lidar_count_debug: per-return LiDAR support count -> Foxglove -----
# Publishes /debug/lidar_count: sonar return (kind=0) + the LiDAR cluster around
# its closest q* (kind=1), paired by group_id, all carrying count=k.
# Observes the LEGACY eps_L/eps_Lz channels, not the eq-35 column.
lidar_count_debug:
  ros__parameters:
    input_topic:   "classified_returns"
    lidar_topic:   "/cloud_registered"
    map_frame:     "odom"
    eps_L:         0.10   # [m]  ↑ bigger count disc (MUST match return_classifier.eps_L)
    eps_Lz:        0.50   # [m]  z half-height of count cylinder; ≤0 = pure XY (MUST match return_classifier.eps_Lz)
    publish_rate:  5.0    # [Hz] ↑ republish debug cloud faster

# -- Debug — lidar_support_csv_logger: per-return LiDAR-support dump -> CSV -----
# Writes one CSV row per sonar return: position, intensity, μ_I/σ_I, slant,
# published (d, k) vs re-derived (d, k) (XY/horizontal match).
lidar_support_csv_logger:
  ros__parameters:
    enable_csv:    false                       # MASTER SWITCH — true: write CSV; false: node idle
    input_topic:   "classified_returns"
    lidar_topic:   "/cloud_registered"
    csv_path:      "~/ros2_ws/lidar_support_debug.csv"  # output file (overwritten each run)
    eps_L:         0.10   # [m]  count disc radius (MUST match return_classifier.eps_L)
    eps_Lz:        0.50   # [m]  z half-height of count cylinder; ≤0 = pure XY (MUST match return_classifier.eps_Lz)

# -- Node 3b (ALT) — learned_voxel_mapper: ONLINE-LEARNED, NUMBERED classes -----
# Parallel alternative to voxel_mapper. Same per-voxel Dirichlet update, but the
# class likelihoods are learned online and NEW classes are created from distinct
# intensity signatures. Classes are just NUMBERED (0,1,2,…) — NO seabed/object/
# structure labels. FIRST-CUT SCOPE: INTENSITY ONLY (no height/LiDAR/shape, no
# spatial prior). Publishes on its OWN topics; voxel_mapper/save_map untouched.
# Enable with:  ros2 launch sonar_map dirichlet_voxel.launch.py learned_mapper:=true
learned_voxel_mapper:
  ros__parameters:
    input_topic:        "classified_returns"
    voxel_topic:        "learned_voxels"           # per-voxel dominant class_id + confidence
    class_states_topic: "learned_class_states"     # live per-class μ/σ telemetry (Foxglove)
    map_frame:          "odom"

    r_v:      0.05    # [m]  voxel size
    alpha_0:  0.01    # [-]  symmetric Dirichlet prior per class
    eps:      0.0     # [m]  spatial-prior radius; 0 = uniform (intensity-only). >0 not
                      #       wired in this first cut (falls back to uniform + warns).

    # -- Base prior Λ_H: FULLY UNSUPERVISED — starts with 0 classes; EVERY class is
    #    born from Λ_H as distinct intensity signatures appear (eq 53). No μ is ever
    #    hand-set: each class's μ/σ is learned online every scan. ------------------
    h_m0:      800.0   # [I]  central intensity for the new-class predictive (auto-set from μ_I below)
    h_kappa0:  0.01    # [-]  ↓ tiny → uncertain mean → WIDE novelty predictive (catches novelty)
    h_sigma0:  200.0   # [I]  expected within-class intensity spread → how SHARP new classes get
    h_a0:      2.0     # [-]  weak variance-prior shape (confirmation budget)
    seed_lambda_h_from_mu_i: true  # center Λ_H on the live seabed intensity μ_I on scan 1

    # -- CLASS-GENERATION CONTROLS (how new classes are born) --------------------
    # Novelty accrues per INTENSITY BIN (not per voxel): real returns are ~1-per-
    # voxel, so a class is born when a distinct INTENSITY SIGNATURE gathers enough
    # sustained novel returns anywhere in the map.
    gamma:                0.5   # [-] stick-breaking concentration; ↑ novelty easier → MORE classes
    novelty_return_floor: 0.5   # [-] r_new a single return needs to count as novel; ↑ stricter
    novelty_bin:          150.0 # [I] width of the intensity bin novelty accrues in; ↑ coarser modes
    novelty_min_count:    25    # [#] sustained novel returns in ONE intensity bin before birth; ↑ stricter
    novelty_mass_thresh:  12.0  # [-] total novelty mass in that bin before birth; ↑ stricter
    create_merge_sigmas:  3.0   # [σ] don't spawn a class within kσ of an existing one (dedup
                                #     nearby intensity bins into one class); ↑ FEWER, broader classes
    max_classes:          32    # [#] capacity of the dynamic inventory / per-voxel vector

    # -- Publishing / display (no effect on the posterior) -----------------------
    active_publish_rate: 2.0
    w_ref:               5.0
    w_display_min:       1.0
    log_class_every:     50   # [scans] log the full class inventory this often (debug)
