# =============================================================================
# dirichlet_voxel.yaml
# Configuration for the Dirichlet-Categorical voxel mapping pipeline.
# Used by: dirichlet_voxel.launch.py
#
# Every threshold, multiplier, resolution, gain and rate referenced by the
# pipeline lives in this file — nothing is hard-coded in the nodes.
#
# Nodes configured here (in data-flow order):
#   0. sonar_scan_ned     — transforms raw sonar returns into the odom frame
#   1. seabed_estimator   — dual scalar Kalman filter (seabed depth + intensity)
#   2. return_classifier  — labels returns FREE / SEABED / OBJECT / STRUCTURE
#   3. voxel_mapper       — Dirichlet voxel map + promotion protocol
#   4. seabed_surface     — promotion sweep + feedback (patches / mesh stripped for performance)
#
# Frame: odom (ENU, z up). Depth is positive-downward from the z = 0 datum.
# =============================================================================

# -----------------------------------------------------------------------------
# Node 0 — sonar_scan_ned  (pipeline front-end)
# Transforms raw leading-edge sonar returns into the odom frame and republishes
# them on `sonar_scan`, the topic the rest of the pipeline consumes.
# -----------------------------------------------------------------------------
sonar_scan_ned:
  ros__parameters:
    odom_frame:               "odom"
    sonar_frame:              "blueview_sonar"
    sonar_cloud_topic:        "/blueview/point2/leading"
    output_topic:             "sonar_scan"
    tf_timeout:               0.5
    scan_publish_rate:        5.0    # [Hz] throttle on republished scans
    latency_compensation_ms:  0.0    # [ms] sonar-to-pose latency compensation

# -----------------------------------------------------------------------------
# Node 1 — seabed_estimator
# -----------------------------------------------------------------------------
seabed_estimator:
  ros__parameters:
    input_topic:        "sonar_scan"               # raw sonar returns (odom frame)
    state_topic:        "seabed_estimator_state"   # published estimator state
    mu_intensity_topic: "seabed_mu_intensity"      # std_msgs/Float64 mirror of mu_i — for plotting

    # The depth Kalman filter was removed — only intensity is tracked here.
    # SeabedEstimatorState still carries mu_h, var_h (always 0) for backward
    # compatibility with subscribers; voxel_mapper ignores it.

    # -- Per-scan measurement --
    intensity_outlier_sigma: 2.0    # [-]  gate width for z_I outlier removal
    min_returns:             10     # min returns in a scan to run an update

    # -- Prior --
    i_prior_mean: 1000.0  # [intensity]  initial seabed intensity guess
    i_prior_std:  1000.0   # [intensity]  initial seabed intensity uncertainty

    # -- Process noise from mission-scale prior --
    # Per-scan std = variation / sqrt(_N_SCANS_FOR_DRIFT), where the scan
    # horizon is a constant inside seabed_estimator.py (the mission's true scan
    # count is usually unknown).
    seabed_intensity_variation: 600.0   # [intensity]  peak-to-peak intensity over mission

    # -- Adaptive measurement noise: floor + coupling * within-scan MAD --
    i_meas_noise_floor:    50.0   # [intensity]  sensor-intrinsic intensity floor
    i_meas_noise_coupling: 1.0    # [-]          MAD coupling for intensity

# -----------------------------------------------------------------------------
# Node 2 — return_classifier
# -----------------------------------------------------------------------------
return_classifier:
  ros__parameters:
    input_topic:   "sonar_scan"               # raw sonar returns (odom frame)
    lidar_topic:   "/cloud_registered"        # LiDAR point cloud (odom frame)
    state_topic:   "seabed_estimator_state"   # estimator state subscription
    odom_topic:    "odometry"                 # USV pose, for slant range
    output_topic:  "classified_returns"       # published classified batch

    # -- Adaptive intensity threshold (multiplier on mu_I) --
    # Single SEABED vs (STRUCTURE/OBJECT) cut: returns brighter than
    # lambda_str_obj * mu_I are non-SEABED (then split into STRUCTURE vs OBJECT
    # by has_support). The Dirichlet weights are driven by the soft
    # responsibility (alpha_i), not by this threshold.
    lambda_str_obj: 2.0   # [-]  tau_str_obj = lambda_str_obj * mu_I

    # -- Geometric LiDAR support factors (shipped separately, combined in voxel_mapper) --
    # d_factor     = exp(-d / d_scale),                       d = ||return_xy - q*_xy||
    # count_factor = 1 - exp(-alpha_count * count),           count = # LiDAR pts within r_lidar of q*
    # voxel_mapper multiplies these into the STRUCTURE responsibility (with the
    # intensity-similarity gate); the complement goes to OBJECT.
    r_lidar:     0.5      # [m]  full-disc radius around q* for count_factor
    d_scale:     0.2      # [m]  sharp distance gate length for d_factor. Smaller = stricter "I am AT a LiDAR point".
    alpha_count: 0.05     # [-]  count_factor saturation rate (raise to make LiDAR proximity matter more)

# -----------------------------------------------------------------------------
# Node 3 — voxel_mapper
# Accumulates Dirichlet evidence. It does NOT promote — it publishes the active
# store as a snapshot and retires voxels when seabed_surface feeds keys back.
# -----------------------------------------------------------------------------
voxel_mapper:
  ros__parameters:
    input_topic:         "classified_returns"   # classified returns subscription
    voxel_topic:         "dirichlet_voxels"     # active voxel cloud (visualisation)
    voxel_map_topic:     "dirichlet_voxel_map"  # full snapshot for seabed_surface
    promoted_keys_topic: "promoted_voxel_keys"  # promotion feedback (subscribed)
    map_frame:           "odom"

    r_v:             0.20   # [m]  voxel resolution
    ring_buffer_len: 10     # [-]  recent return depths kept per voxel

    # -- Dirichlet-Categorical model --
    alpha_0:   0.01   # [-]  symmetric Dirichlet prior concentration (<< 1)

    # -- Sonar elevation-angle uncertainty --
    # A SEABED return at slant range r is uncertain in z by Delta_z = k_elev * r,
    # so its unit mass is spread uniformly over voxels in [z - Delta_z/2,
    # z + Delta_z/2]. Set 0 to disable the spread and revert to a single voxel.
    k_elev: 0.0

    # -- Soft Dirichlet responsibility (per-return class distribution) --
    # u            = max(I - mu_i, 0) / mu_i                  intensity excess
    # r_sb         = exp(-alpha_i * u)                        SEABED responsibility
    # f_L_geom     = d_factor * count_factor                  geometric LiDAR gate (from message)
    # similarity   = exp(-(I - mu_str_local)^2 / (2 sigma^2)) intensity match to local structure profile
    #                (mu_str_local = mean intensity_mean of neighbour voxels with
    #                 d_factor_cached >= tau_sim; sigma = sigma_sim * mu_str_local;
    #                 similarity = 1 when fewer than n_min_neighbors qualify)
    # f_L_eff      = f_L_geom * similarity                    final STRUCTURE gate
    # f_obj_boost  = 1 - exp(-alpha_obj * max(u - u_obj_thresh, 0))
    #                "very bright -> OBJECT" boost; steals f_obj_boost of the
    #                STRUCTURE share into OBJECT. 0 unless u > u_obj_thresh.
    # r_str        = (1 - r_sb) * f_L_eff * (1 - f_obj_boost) STRUCTURE
    # r_obj        = (1 - r_sb) * ((1 - f_L_eff) + f_L_eff * f_obj_boost)  OBJECT
    # Sum = 1 per non-FREE return.
    # alpha_i sharpness rule: alpha_i = ln(2) / u_half, where u_half is the
    # intensity excess (I_decision - mu_i)/mu_i at which you want r_sb = 0.5.
    alpha_i:           1.0    # [-]  intensity-gate sharpness (higher = sharper SB <-> non-SB)

    # -- LiDAR-derived per-voxel STRUCTURE prior --
    # On voxel creation we cache d_factor_cached from the first observation, then
    # set alpha_str_prior = beta_struct_prior * d_factor_cached. This prior enters
    # pi_str's numerator (and once in the shared denominator), so LiDAR-proximate
    # voxels start as STRUCTURE and decay toward their evidence-driven posterior.
    beta_struct_prior: 3.0    # [-]  prior strength (~pseudo-observations of STRUCTURE at d=0)

    # -- Intensity-similarity gate (drives side voxels' pi_str down over time) --
    sigma_sim:         0.3    # [-]  tolerance as fraction of mu_str_local: sigma = sigma_sim * mu_str_local
    tau_sim:           0.5    # [-]  d_factor threshold for "structure-plausible" neighbour
    r_sim_voxels:      2      # [-]  neighbour search radius in voxels (cube side = 2*R + 1)
    n_min_neighbors:   3      # [-]  min qualifying neighbours before similarity gating kicks in (else similarity = 1)

    # -- "Very bright -> OBJECT" boost --
    # Once a return's intensity excess u = (I - mu_i)/mu_i exceeds u_obj_thresh,
    # f_obj_boost = 1 - exp(-alpha_obj * (u - u_obj_thresh)) transfers part of
    # the LiDAR-supported STRUCTURE share into OBJECT. Lets isolated very-bright
    # returns register as OBJECT even when they sit near a LiDAR cluster.
    # Setting alpha_obj = 0 (or u_obj_thresh = +inf) disables the boost.
    u_obj_thresh:      0.5    # [-]  u must exceed this to engage (0.5 = I > 1.5*mu_i)
    alpha_obj:         1.5    # [-]  saturation rate above the threshold

    # -- Publish rates --
    active_publish_rate: 5.0    # [Hz]  visualisation cloud republish rate
    snapshot_rate:       1.0    # [Hz]  voxel-map snapshot rate (seabed_surface input)
    w_ref:               10.0   # [-]   tanh scale: confidence = max_pi * tanh(W/w_ref)
    w_display_min:       1.0    # [-]   display-only lower bound on W

# -----------------------------------------------------------------------------
# Node 4 — seabed_surface
# Stripped to the bare minimum for performance debugging: every 1/sweep_rate
# seconds it sweeps the voxel-map snapshot, marks every SEABED-ready voxel as
# promoted, and feeds the keys back to voxel_mapper. Patch aggregation, the
# smoothed mesh and /debug/promoted have all been removed.
# -----------------------------------------------------------------------------
seabed_surface:
  ros__parameters:
    voxel_map_topic:     "dirichlet_voxel_map"   # voxel-map snapshot subscription
    promoted_keys_topic: "promoted_voxel_keys"   # promotion feedback (published)
    map_frame:           "odom"

    # -- Promotion-readiness check: argmax pi == SEABED, pi >= pi_conf, W >= w_conf
    alpha_0: 0.01     # [-]  symmetric Dirichlet prior (MUST match voxel_mapper.alpha_0)
    pi_conf: 0.7      # [-]  posterior confidence threshold
    w_conf:  25.0     # [-]  accumulated evidence weight threshold (~25 SEABED returns)

    sweep_rate: 0.2   # [Hz]  promotion sweep / feedback rate (every 5 s)
